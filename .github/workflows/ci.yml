name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest

    # F1-08: tenant-isolasjonssuiten trenger en ekte Postgres. Uten DB hopper
    # testene over seg selv — og en grønn CI ville vært en løgn.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: endwise
          POSTGRES_PASSWORD: endwise
          POSTGRES_DB: endwise
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U endwise"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://endwise:endwise@localhost:5432/endwise

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: corepack enable
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Migrer database (RLS + policyer)
        run: pnpm db:migrate
      - run: pnpm test
