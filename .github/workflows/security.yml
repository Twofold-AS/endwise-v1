# F0-15 — Sikkerhetsgate i CI (v1.3, utvidet v1.6)
# Mål: ASVS L2 (L3 for auth + betaling). Null åpne CWE-funn.
name: Security gate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL (CWE-mappet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3

  semgrep:
    name: Semgrep (OWASP + CWE)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep ci --config p/owasp-top-ten --config p/typescript --config p/secrets --sarif --output semgrep.sarif || true
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif

  dependencies:
    name: Dependency-Check (pnpm audit + OWASP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (fail på high/critical)
        run: pnpm audit --audit-level high
      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: endwise
          path: "."
          format: SARIF
          # pnpm-repo: Yarn-analysatoren krasjer jobben («Unable to determine yarn»).
          # Pnpm Audit Analyzer kjører uansett.
          args: "--disableYarnAudit"
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/dependency-check-report.sarif

  zap-baseline:
    name: ZAP baseline mot preview
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      actions: write
      deployments: read
    steps:
      - uses: actions/checkout@v4
      - name: Vent på Vercel-preview
        id: preview
        env:
          PREVIEW_OVERRIDE: ${{ vars.PREVIEW_URL }}
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -n "${PREVIEW_OVERRIDE:-}" ]; then
            echo "url=${PREVIEW_OVERRIDE}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Branch-alias kan bli kortere enn 63 tegn (DNS). Bruk denne SHA-ens
          # Preview-deployment, så ZAP treffer riktig Vercel-URL med CSP.
          for _ in $(seq 1 90); do
            id="$(gh api "repos/${REPO}/deployments?sha=${SHA}" --jq '[.[] | select(.environment=="Preview")][0].id // empty' || true)"
            url=""
            if [ -n "${id}" ]; then
              url="$(gh api "repos/${REPO}/deployments/${id}/statuses" --jq '[.[] | select(.state=="success") | .environment_url // empty][0] // empty' || true)"
            fi
            if [ -n "${url}" ]; then
              headers="$(curl -sSI --max-time 15 "$url" || true)"
              if printf '%s' "$headers" | grep -qi '^content-security-policy:'; then
                echo "Fant preview ${url} med CSP"
                echo "url=${url}" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Preview uten CSP-header for ${SHA}" >&2
          exit 1
      - name: Gjør workspace skrivbart for ZAP
        run: chmod a+w .
      - name: ZAP baseline
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ steps.preview.outputs.url }}
          fail_action: false
          allow_issue_writing: false
