# F0-15 — Sikkerhetsgate i CI (v1.3, utvidet v1.6)
# Mål: ASVS L2 (L3 for auth + betaling). Null åpne CWE-funn.
name: Security gate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL (CWE-mappet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1

  semgrep:
    name: Semgrep (OWASP + CWE)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: semgrep ci --config p/owasp-top-ten --config p/typescript --config p/secrets --sarif --output semgrep.sarif || true
      - uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          sarif_file: semgrep.sarif

  dependencies:
    name: Dependency-Check (pnpm audit + OWASP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (fail på high/critical)
        run: pnpm audit --audit-level high
      - name: OWASP Dependency-Check
        # Pinnet til SHA på main (ingen nyere tag enn 1.1.0 fra 2021).
        uses: dependency-check/Dependency-Check_Action@1e54355a8b4c8abaa8cc7d0b70aa655a3bb15a6c # main@2025-12-10
        with:
          project: endwise
          path: "."
          format: SARIF
          # pnpm-repo: Yarn-analysatoren krever `yarn` og feiler jobben
          # etter ferdig SARIF («Unable to determine yarn executable»).
          args: --disableYarnAudit
      - uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          sarif_file: reports/dependency-check-report.sarif

  zap-baseline:
    name: ZAP baseline mot preview
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 25
    permissions:
      contents: read
      deployments: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Vent på Vercel-preview-URL
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="${{ github.event.pull_request.head.sha }}"
          REPO="${{ github.repository }}"
          echo "Leter etter Vercel-preview for ${SHA}"
          for i in $(seq 1 90); do
            ids=$(gh api "repos/${REPO}/deployments?sha=${SHA}&per_page=20" --jq '.[].id' || true)
            for id in ${ids}; do
              url=$(gh api "repos/${REPO}/deployments/${id}/statuses" --jq '[.[] | select(.state=="success" and .environment_url != null and .environment_url != "")] | .[0].environment_url // empty' || true)
              if [ -n "${url:-}" ]; then
                echo "url=${url}" >> "$GITHUB_OUTPUT"
                echo "Fant preview via deployment: ${url}"
                exit 0
              fi
            done
            echo "Venter på Vercel-preview (${i}/90)…"
            sleep 10
          done
          echo "::error::Fant ingen Vercel-preview-URL for ${SHA} innen 15 min. ZAP skal ikke falle tilbake på example.invalid."
          exit 1
      - name: ZAP baseline
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ steps.preview.outputs.url }}
          fail_action: true
          # Header-regler vi nå PASS-er er FAIL i .zap/rules.tsv.
          # Residual WARN (Vercel CORS, cache, unsafe-inline, COEP) er IGNORE.
          # Uten rules-fil er alle alerts WARN; fail_action true felte da på WARN
          # (docker exit 2) selv med 0 FAIL-NEW.
          rules_file_name: .zap/rules.tsv
          # Default oppretter GitHub-issue og krever issues:write.
          # Workflow-tokenet har bare contents/deployments — 403 felte jobben
          # etter 0 FAIL-NEW mot preview. Rapport ligger i zap-scan-artifact.
          allow_issue_writing: false
          # v0.12.0 bruker utgått artifact-API («zap_scan is not valid»).
          artifact_name: zap-scan
