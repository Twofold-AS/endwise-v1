# F0-15 — Sikkerhetsgate i CI (v1.3, utvidet v1.6)
# Mål: ASVS L2 (L3 for auth + betaling). Null åpne CWE-funn.
name: Security gate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL (CWE-mappet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3

  semgrep:
    name: Semgrep (OWASP + CWE)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep ci --config p/owasp-top-ten --config p/typescript --config p/secrets --sarif --output semgrep.sarif || true
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif

  dependencies:
    name: Dependency-Check (pnpm audit + OWASP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (fail på high/critical)
        run: pnpm audit --audit-level high
      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: endwise
          path: "."
          format: SARIF
          # pnpm-repo: Yarn-analysatoren krever `yarn` og feiler jobben
          # etter ferdig SARIF («Unable to determine yarn executable»).
          args: --disableYarnAudit
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/dependency-check-report.sarif

  zap-baseline:
    name: ZAP baseline mot preview
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 25
    permissions:
      contents: read
      deployments: read
    steps:
      - uses: actions/checkout@v4
      - name: Vent på Vercel-preview-URL
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="${{ github.event.pull_request.head.sha }}"
          REPO="${{ github.repository }}"
          echo "Leter etter Vercel-preview for ${SHA}"
          for i in $(seq 1 90); do
            ids=$(gh api "repos/${REPO}/deployments?sha=${SHA}&per_page=20" --jq '.[].id' || true)
            for id in ${ids}; do
              url=$(gh api "repos/${REPO}/deployments/${id}/statuses" --jq '[.[] | select(.state=="success" and .environment_url != null and .environment_url != "")] | .[0].environment_url // empty' || true)
              if [ -n "${url:-}" ]; then
                echo "url=${url}" >> "$GITHUB_OUTPUT"
                echo "Fant preview via deployment: ${url}"
                exit 0
              fi
            done
            echo "Venter på Vercel-preview (${i}/90)…"
            sleep 10
          done
          echo "::error::Fant ingen Vercel-preview-URL for ${SHA} innen 15 min. ZAP skal ikke falle tilbake på example.invalid."
          exit 1
      - name: ZAP baseline
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ steps.preview.outputs.url }}
          fail_action: false
          # Default oppretter GitHub-issue og krever issues:write.
          # Workflow-tokenet har bare contents/deployments — 403 felte jobben
          # etter 0 FAIL-NEW mot preview. Rapport ligger i zap_scan-artifact.
          allow_issue_writing: false
