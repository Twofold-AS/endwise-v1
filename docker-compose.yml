# Lokal utvikling (techstack §2 Fundament: "Docker Compose — kun for lokal dev").
# Prod-DB blir Neon (EU) når vi kobler på deploy. Se docs/roadmap-endringer.md.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: endwise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: endwise
      POSTGRES_PASSWORD: endwise
      POSTGRES_DB: endwise
    ports:
      - "5432:5432"
    volumes:
      - endwise-pgdata:/var/lib/postgresql/data
      # Roller + pgvector. Kjøres KUN ved første oppstart av et tomt volum.
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U endwise -d endwise"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  endwise-pgdata:
