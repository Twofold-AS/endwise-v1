packages:
  - "apps/*"
  - "packages/*"
  - "packages/tools/toolkits/*"
  - "framer-plugin"

# drizzle-orm låst til én versjon: better-auth@1.6.30 krever ^0.45.2.
# 0.45.2 tilfredsstiller også eldre peer-ranges (>=0.41.0).
# pnpm 11 leser overrides her, ikke lenger i package.json.
#
# Transitive high/critical (foreldre har ikke sluppet patched barn):
# lodash via auth CLI > prisma-ast > chevrotain (GHSA-r5fr-rjxr-66jc)
# fast-uri via Sentry webpack plugin / ajv (GHSA-v2hh-gcrm-f6hx, GHSA-7p8r-x3mc-p8w7)
# sharp via next (GHSA-f88m-g3jw-g9cj)
# postcss via next (GHSA-6g55-p6wh-862q, GHSA-r28c-9q8g-f849)
# brace-expansion via workflow/oclif/minimatch (GHSA-mh99-v99m-4gvg, GHSA-rgw5-rvv9-x895)
# undici via ai-sdk / workflow (GHSA-4cwx-7wf7-3272)
# nanoid via workflow/next/postcss (GHSA-28wg-ghj8-5hjv, GHSA-2v37-7h3g-55p8)
# better-auth er IKKE overstyrt — runtime + CLI er ekte 1.6.30-bumps.
overrides:
  drizzle-orm: 0.45.2
  lodash: 4.18.1
  fast-uri: 3.1.6
  sharp: ">=0.35.0"
  postcss: ">=8.5.18"
  "brace-expansion@^2.0.0": "2.1.4"
  "brace-expansion@^5.0.0": "5.0.9"
  undici: "^7.29.0"
  "nanoid@^3.0.0": "3.3.18"
  "nanoid@^5.0.0": "5.1.16"

allowBuilds:
  '@prisma/client': false
  '@sentry/cli': false
  '@swc/core': true
  better-sqlite3: false
  cbor-extract: false
  esbuild: true
  lefthook: true
  sharp: false

minimumReleaseAge: 0
