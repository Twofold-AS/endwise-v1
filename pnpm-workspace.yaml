packages:
  - "apps/*"
  - "packages/*"
  - "packages/tools/toolkits/*"
  - "framer-plugin"

# drizzle-orm låst til én versjon: better-auth 1.7.x krever ^0.45.2.
# 0.45.2 tilfredsstiller også eldre peer-ranges (>=0.41.0).
# pnpm 11 leser overrides her, ikke lenger i package.json.
#
# Transitive high/critical (foreldre har ikke sluppet patched barn).
# better-auth er IKKE overstyrt — runtime + CLI er ekte 1.7.7-bumps.
overrides:
  drizzle-orm: 0.45.2
  lodash: 4.18.1
  fast-uri: ">=3.1.7"
  sharp: ">=0.35.5"
  postcss: ">=8.5.18"
  "brace-expansion@^2.0.0": "2.1.6"
  "brace-expansion@^5.0.0": "5.0.11"
  undici: ">=7.30.1"
  "nanoid@^3.0.0": "3.3.18"
  "nanoid@^5.0.0": "5.1.16"
  zod: ">=4.6.6"
  axios: ">=1.20.0"
  follow-redirects: ">=1.16.2"
  body-parser: ">=2.4.0"
  browserslist: ">=4.28.7"
  devalue: ">=5.9.3"
  source-map-js: ">=1.2.2"
  proxy-addr: ">=2.0.8"
  piscina: ">=4.9.4"
  "@xhmikosr/decompress": ">=11.1.4"
  "vite@^8.0.0": "8.1.6"

allowBuilds:
  '@prisma/client': false
  '@sentry/cli': false
  '@swc/core': true
  better-sqlite3: false
  cbor-extract: false
  esbuild: true
  lefthook: true
  sharp: false

minimumReleaseAge: 0
