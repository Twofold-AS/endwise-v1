packages:
  - "apps/*"
  - "packages/*"
  - "packages/tools/toolkits/*"
  - "framer-plugin"

# drizzle-orm låst til én versjon: better-auth@1.6.30 krever ^0.45.2.
# 0.45.2 tilfredsstiller også eldre peer-ranges (>=0.41.0).
# pnpm 11 leser overrides her, ikke lenger i package.json.
#
# Transitive high/critical (foreldre har ikke sluppet patched barn):
# next via workflow/@sentry/better-auth (GHSA-673q-mjm6-r5xr, GHSA-2464-fhr4-w9xw, …)
# lodash via auth CLI > prisma-ast > chevrotain (GHSA-r5fr-rjxr-66jc)
# fast-uri via Sentry webpack plugin / ajv (GHSA-qw65-cvwx-89v3, GHSA-58mr-gqgx-xq4g)
# sharp via next (GHSA-wq5f-xc86-pv6w / CVE-2026-96889)
# postcss via next (GHSA-6g55-p6wh-862q, GHSA-r28c-9q8g-f849)
# brace-expansion via workflow/oclif/minimatch (GHSA-qhr7-859c-m2p7, GHSA-6j4f-fj2g-mc7p)
# undici via ai-sdk / workflow (GHSA-rfgv-xxqx-mfg5, GHSA-w293-vg96-wgc3)
# nanoid via workflow/next/postcss (GHSA-28wg-ghj8-5hjv, GHSA-2v37-7h3g-55p8)
# axios/follow-redirects via twilio (GHSA-c29m-xwm3-cm6r, GHSA-q3jh-wrc6-jgq8, …)
# devalue via workflow (GHSA-r9w8-h9r3-54w4 m.fl.)
# vite via vitest / framer-plugin (GHSA-587h-7wmj-h5pm)
# better-auth er IKKE overstyrt — runtime + CLI er ekte 1.6.30-bumps.
overrides:
  drizzle-orm: 0.45.2
  next: 16.4.2
  lodash: 4.18.1
  fast-uri: 3.1.9
  sharp: ">=0.35.5"
  postcss: ">=8.5.23"
  "brace-expansion@^2.0.0": "2.1.7"
  "brace-expansion@^5.0.0": "5.0.12"
  undici: "^7.29.1"
  "nanoid@^3.0.0": "3.3.18"
  "nanoid@^5.0.0": "5.1.16"
  axios: ">=1.20.0"
  follow-redirects: ">=1.16.1"
  devalue: ">=5.9.3"
  source-map-js: ">=1.2.2"
  http-cache-semantics: ">=4.2.1"
  browserslist: ">=4.28.7"
  "vite@^6.0.0": "6.4.5"
  "vite@^8.0.0": "8.3.5"
  piscina: ">=4.9.4"
  proxy-addr: ">=2.0.8"
  "@xhmikosr/decompress": ">=11.1.4"

allowBuilds:
  '@prisma/client': false
  '@sentry/cli': false
  '@swc/core': true
  better-sqlite3: false
  cbor-extract: false
  esbuild: true
  lefthook: true
  sharp: false

minimumReleaseAge: 0
